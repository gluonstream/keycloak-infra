apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - keycloak-namespace.yaml
  - postgres.yaml
  - keycloak.yaml
  - keycloak-realm-configmap.yaml

namespace: keycloak-namespace

secretGenerator:
  - name: db-secrets
    literals:
      - password=keycloak
  - name: keycloak-admin-secrets
    literals:
      - password=admin

generatorOptions:
  disableNameSuffixHash: true
