---
# ReferenceGrant allows the Gateway in gateway-namespace to accept
# HTTPRoutes from the 'keycloak-namespace'.
# Without this, cross-namespace parentRefs might be silently rejected
# depending on the Gateway implementation and configuration.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-keycloak-to-global-gateway
  namespace: gateway-namespace
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: keycloak-namespace
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: global-gateway
