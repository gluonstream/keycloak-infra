apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-env
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_HOSTNAME: "auth.s4v3.net"
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HOSTNAME_URL: "http://auth.s4v3.net"
  KC_HOSTNAME_ADMIN_URL: "http://auth.s4v3.net"
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://postgres-db:5430/keycloak"
  KC_DB_USERNAME: "keycloak"
