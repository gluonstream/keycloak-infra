apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: keycloak-namespace
spec:
  parentRefs:
    - name: kong
      namespace: kong-gateway-namespace
  hostnames:
    - auth.s4v3.local
    - auth.s4v3.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
