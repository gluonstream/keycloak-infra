apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rook-ceph

# 1. First, we define the Operator (The Generator)
helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.19.0
    releaseName: rook-ceph
    namespace: rook-ceph
    valuesFile: values.yaml
    includeCRDs: true

# 2. Then, we add the actual Cluster resource
resources:
  - cluster.yaml
  - ceph-storage.yaml
  - ceph-pvc.yaml
